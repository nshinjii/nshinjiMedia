name: Update YouTube Videos
on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh YouTube uploads
        run: |
          python - <<'PY'
          import json, re, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone
          
          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'NshinjiMedia/1.0 (public YouTube feed)'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode('utf-8')
          
          source = Path('index.html').read_text()
          seed = json.loads(re.search(r'let uploads=(\[.*?\]),videoFilter=', source, re.S).group(1))
          data = {'videos': seed}
          try:
              previous = json.loads(get('https://nshinjimedia.co.uk/content.json'))
              if previous.get('channelId') == 'UCIa-bzHuoaBa6HxGaRTyA7g' and previous.get('videos'):
                  data = previous
          except Exception:
              pass
          try:
              root = ET.fromstring(get('https://www.youtube.com/feeds/videos.xml?channel_id=UCIa-bzHuoaBa6HxGaRTyA7g'))
              ns = {'a': 'http://www.w3.org/2005/Atom', 'yt': 'http://www.youtube.com/xml/schemas/2015', 'm': 'http://search.yahoo.com/mrss/'}
              videos = {v['id']: v for v in data['videos']}
              entries = root.findall('a:entry', ns)
              if not entries:
                  raise ValueError('YouTube returned an empty feed')
              for entry in entries:
                  vid = entry.findtext('yt:videoId', namespaces=ns)
                  title = entry.findtext('a:title', namespaces=ns)
                  date = entry.findtext('a:published', namespaces=ns)
                  if not vid or not re.fullmatch(r'[\w-]{11}', vid) or not title or not date:
                      raise ValueError('Incomplete video entry')
                  old = videos.get(vid, {})
                  kind = old.get('type')
                  if not kind:
                      # Shorts redirect to /watch when the upload is a regular video.
                      try:
                          request = urllib.request.Request('https://www.youtube.com/shorts/' + vid, headers={'User-Agent': 'Mozilla/5.0'})
                          with urllib.request.urlopen(request, timeout=20) as response:
                              kind = 'Videos' if '/watch' in response.url else 'Shorts'
                      except Exception:
                          kind = 'Shorts' if re.search(r'#shorts\b', title, re.I) else 'Videos'
                  stats = entry.find('m:group/m:community/m:statistics', ns)
                  views = stats.get('views') if stats is not None else old.get('views')
                  videos[vid] = {'id': vid, 'title': title, 'date': date, 'type': kind, 'views': views}
              data = {'channelId': 'UCIa-bzHuoaBa6HxGaRTyA7g', 'videos': sorted(videos.values(), key=lambda v: v.get('date', ''), reverse=True), 'youtubeUpdatedAt': datetime.now(timezone.utc).isoformat()}
              print('YouTube refreshed:', len(data['videos']), 'uploads')
          except Exception as error:
              print('::warning::YouTube refresh unavailable; retaining existing uploads: ' + str(error))
          Path('_site').mkdir(exist_ok=True)
          Path('_site/content.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          cp index.html CNAME game-*.mp4 game-*.jpg _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for website artifact to become available
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'github-pages-${{ github.run_id }}-${{ github.run_attempt }}';
            // Uploads can briefly be missing from the Actions artifact listing.
            for (let attempt = 1; attempt <= 12; attempt++) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { ...context.repo, run_id: context.runId, per_page: 100 }
              );
              if (artifacts.some(artifact => artifact.name === artifactName && !artifact.expired)) {
                core.info('Website artifact is available for deployment.');
                return;
              }
              if (attempt < 12) {
                core.info('Waiting for GitHub to expose the uploaded website artifact...');
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            core.setFailed('GitHub did not expose the uploaded website artifact within 55 seconds.');
      - name: Publish updated website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

